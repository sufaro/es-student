name: MODEL — 3.2.4 Поток с двойной буферизацией

on:
  push:
    paths:
      - '321-audio-recorder/**'
      - 'libs/**'
      - '.github/workflows/check-3-2-4.yml'
      - 'tests/**'
      - 'MODEL-MANIFEST.json'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-3-2-4.yml@master
    # Model evidence is not a physical lab result; never submit it to the LMS.
    with:
      lms_url: ""
