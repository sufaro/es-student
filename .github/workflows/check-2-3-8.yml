name: MODEL — 2.3.8 Приёмка прибора

on:
  push:
    paths:
      - '231-firmware-template/**'
      - 'libs/**'
      - '.github/workflows/check-2-3-8.yml'
      - 'tests/**'
      - '.github/workflows/model-check.yml'
      - 'MODEL-MANIFEST.json'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/model-check.yml
    with:
      task: 2-3-8
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}
